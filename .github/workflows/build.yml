name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          VC_SERVER_URL: ${{ vars.VC_SERVER_URL }}
        run: |
          set +e
          gradle -p android assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -15 > errs.txt
            sed -n '/What went wrong/,/^\* Try/p' build.log | head -15 >> errs.txt
            {
              echo "## Build errors"
              echo '```'
              cat errs.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Build failed::$(tr '\n' ' ' < errs.txt)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VCBridge-apk
          path: android/app/build/outputs/apk/debug/*.apk

  addon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package .mcaddon
        run: |
          cd addon
          zip -r ../VCBridge.mcaddon behavior_pack resource_pack
      - uses: actions/upload-artifact@v4
        with:
          name: VCBridge-addon
          path: VCBridge.mcaddon
