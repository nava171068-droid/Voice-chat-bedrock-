name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
        env:
          VC_SERVER_URL: ${{ vars.VC_SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: VCBridge-apk
          path: android/app/build/outputs/apk/debug/*.apk

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package .mcaddon
        run: |
          cd addon
          zip -r ../VCBridge.mcaddon behavior_pack resource_pack
      - uses: actions/upload-artifact@v4
        with:
          name: VCBridge-addon
          path: VCBridge.mcaddon
